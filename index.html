<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ClinicPad: paper forms, reinvented for the clinic</title>
<meta name="description" content="A tablet app for therapy and dental clinics that replaces paper intake forms, enforces a mandatory safety checklist, prints one file and stores nothing." />
<meta name="theme-color" content="#0fa3a3" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230fa3a3'/%3E%3Cpath d='M27 14h10v13h13v10H37v13H27V37H14V27h13z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="plates" aria-hidden="true">
  <div class="plate" id="p-hall"><div class="box"><img data-plate="hall" alt="" decoding="async" /></div></div>
  <div class="plate" id="p-river"><div class="box"><img data-plate="river" alt="" decoding="async" /></div></div>
  <div class="plate" id="p-hero"><div class="box"><img class="half l" data-plate="hero" alt="" /><img class="half r" data-plate="hero" alt="" /><i class="seam"></i></div><div class="veil"></div></div>
</div>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="css-bg" aria-hidden="true"><div class="css-tablet"><div class="css-screen"></div></div></div>
<div id="loader"><div class="loader-mark"></div></div>

<header class="nav">
  <a class="logo" href="#hero"><span class="logo-mark"></span><span data-brand></span></a>
  <nav class="links">
    <a href="#how" data-i18n="nav_how"></a>
    <a href="#safety" data-i18n="nav_safety"></a>
    <a href="#benefits" data-i18n="nav_benefits"></a>
    <a href="#v2" data-i18n="nav_v2"></a>
  </nav>
  <div class="nav-right">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button>
    </div>
    <a class="btn btn-small" href="#demo" data-i18n="nav_demo"></a>
  </div>
</header>

<main>
  <section id="hero" class="stage">
    <div class="hero-copy">
      <p class="eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_sub"></p>
      <div class="cta-row">
        <a class="btn" href="#demo" data-i18n="hero_cta1"></a>
        <a class="btn btn-ghost" href="#how" data-i18n="hero_cta2"></a>
        <a class="btn btn-ghost" href="./app/" data-i18n="try_app"></a>
      </div>
      <ul class="badges">
        <li data-i18n="badge1"></li><li data-i18n="badge2"></li><li data-i18n="badge3"></li>
      </ul>
    </div>
    <div class="scroll-hint"><span data-i18n="hero_scroll"></span><i></i></div>
  </section>

  <section id="stage-rise" class="stage tall">
    <div class="sticky-cap cap-bottom">
      <h2 data-i18n="stage1_title"></h2>
      <p data-i18n="stage1_sub"></p>
    </div>
  </section>

  <section id="stage-doors" class="stage taller">
    <div class="sticky-cap cap-top">
      <h2 data-i18n="stage2_title"></h2>
      <p data-i18n="stage2_sub"></p>
    </div>
  </section>

  <div id="content">
    <section id="how" class="block">
      <div class="card wide reveal">
        <p class="kicker" data-i18n="how_kicker"></p>
        <h2 data-i18n="how_title"></h2>
        <ol class="steps">
          <li><b>1</b><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></li>
          <li><b>2</b><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></li>
          <li><b>3</b><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></li>
          <li><b>4</b><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></li>
          <li><b>5</b><h3 data-i18n="s5_t"></h3><p data-i18n="s5_d"></p></li>
        </ol>
      </div>
    </section>

    <section id="safety" class="block split">
      <div class="card reveal">
        <p class="kicker" data-i18n="safety_kicker"></p>
        <h2 data-i18n="safety_title"></h2>
        <p data-i18n="safety_sub"></p>
        <div class="examples">
          <div class="example">
            <span class="tag" data-i18n="ex_label"></span>
            <div class="bubble q" data-i18n="ex1_q"></div>
            <div class="bubble a" data-i18n="ex1_a"></div>
            <div class="bubble q stop" data-i18n="ex1_r"></div>
          </div>
          <div class="example">
            <span class="tag" data-i18n="ex_label"></span>
            <h3 class="bp" data-i18n="ex2_t"></h3>
            <p data-i18n="ex2_d"></p>
          </div>
        </div>
      </div>
      <div class="card device reveal" id="checklist-demo">
        <div class="dev-head"><span class="logo-mark sm"></span><span data-brand></span><span class="pin" data-i18n="dev_mode"></span></div>
        <div class="alert"><strong data-i18n="alert_t"></strong><span class="tag light" data-i18n="alert_tag"></span></div>
        <ul class="checks" id="checks"></ul>
        <form class="add-q" id="add-q">
          <input id="add-q-input" maxlength="80" data-i18n-ph="add_ph" />
          <button type="submit" class="btn btn-small btn-ghost" data-i18n="add_btn"></button>
        </form>
        <div class="progress"><div class="bar"><i id="bar"></i></div><span id="progress-text"></span></div>
        <p class="missing" id="missing"></p>
        <button class="btn print" id="print-btn" disabled></button>
        <p class="done" id="print-done" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="benefits" class="block">
      <div class="card wide reveal">
        <p class="kicker" data-i18n="ben_kicker"></p>
        <h2 data-i18n="ben_title"></h2>
        <div class="grid">
          <article><span class="ico">✚</span><h3 data-i18n="b1_t"></h3><p data-i18n="b1_d"></p></article>
          <article><span class="ico">❏</span><h3 data-i18n="b2_t"></h3><p data-i18n="b2_d"></p></article>
          <article><span class="ico">➜</span><h3 data-i18n="b3_t"></h3><p data-i18n="b3_d"></p></article>
          <article><span class="ico">✓</span><h3 data-i18n="b4_t"></h3><p data-i18n="b4_d"></p></article>
          <article><span class="ico">◐</span><h3 data-i18n="b5_t"></h3><p data-i18n="b5_d"></p></article>
          <article><span class="ico">⌀</span><h3 data-i18n="b6_t"></h3><p data-i18n="b6_d"></p></article>
        </div>
      </div>
    </section>

    <section id="privacy" class="block right">
      <div class="card reveal">
        <p class="kicker" data-i18n="pr_kicker"></p>
        <h2 data-i18n="pr_title"></h2>
        <ul class="ticks">
          <li data-i18n="pr1"></li><li data-i18n="pr2"></li><li data-i18n="pr3"></li><li data-i18n="pr4"></li>
        </ul>
        <p class="fine" data-i18n="pr_note"></p>
      </div>
    </section>

    <section id="v2" class="block">
      <div class="card reveal v2">
        <p class="kicker soon" data-i18n="v2_kicker"></p>
        <h2 data-i18n="v2_title"></h2>
        <p data-i18n="v2_sub"></p>
        <ul class="pills">
          <li data-i18n="v2_1"></li><li data-i18n="v2_2"></li><li data-i18n="v2_3"></li>
          <li data-i18n="v2_4"></li><li data-i18n="v2_5"></li><li data-i18n="v2_6"></li>
        </ul>
      </div>
    </section>
  </div>

  <section id="demo" class="block">
    <div class="card form-card reveal">
      <p class="kicker" data-i18n="demo_kicker"></p>
      <h2 data-i18n="demo_title"></h2>
      <p data-i18n="demo_sub"></p>
      <p><a class="btn btn-ghost" href="./app/" data-i18n="try_app"></a></p>
      <form id="demo-form" novalidate>
        <label><span data-i18n="f_name"></span><input name="name" required autocomplete="name" /></label>
        <label><span data-i18n="f_clinic"></span><input name="clinic" required autocomplete="organization" /></label>
        <label><span data-i18n="f_type"></span>
          <select name="type">
            <option value="therapy" data-i18n="opt_therapy"></option>
            <option value="dental" data-i18n="opt_dental"></option>
            <option value="chiro" data-i18n="opt_chiro"></option>
            <option value="other" data-i18n="opt_other"></option>
          </select>
        </label>
        <label><span data-i18n="f_email"></span><input name="email" type="email" required autocomplete="email" /></label>
        <label class="full"><span data-i18n="f_phone"></span><input name="phone" type="tel" autocomplete="tel" /></label>
        <button class="btn full" type="submit" data-i18n="f_submit"></button>
        <p class="fine full" data-i18n="f_note"></p>
      </form>
      <div id="thanks" hidden>
        <div class="thanks-mark">✓</div>
        <h3 id="thanks-title"></h3>
        <p data-i18n="thanks_body"></p>
      </div>
    </div>
    <footer class="foot">
      <p data-i18n="disclaimer"></p>
      <p class="copy" data-i18n="copy"></p>
    </footer>
  </section>
</main>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
